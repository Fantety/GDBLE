name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/ci-build

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux BLE dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: Static lifecycle checks
        run: python3 scripts/check-lifecycle.py
      - name: Release and distribution validation tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build-addon:
    uses: ./.github/workflows/build-addon.yml

  final-addon-smoke:
    needs: build-addon
    uses: ./.github/workflows/smoke-addon.yml
    with:
      artifact-name: assembled-addon

  godot-load:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ["4.2.2", "4.6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux BLE dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
      - name: Verify source, callback reentry, permissions, and debugger UI
        run: |
          python3 scripts/test-godot.py --mode source
          python3 scripts/test-godot.py --mode harness
          python3 scripts/test-godot.py --mode permissions
          python3 scripts/test-godot.py --mode debugger
