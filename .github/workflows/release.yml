name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  final-addon-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-latest]
        godot: ["4.2.2", "4.6.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
      - name: Validate and load the exact tag artifacts without rebuilding
        run: |
          python scripts/artifact_provenance.py validate
          python scripts/test-godot.py --mode artifact

  validate-package-publish:
    needs: final-addon-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag commit
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$version"
          python3 scripts/release-notes.py "$GITHUB_REF_NAME"
          python3 scripts/artifact_provenance.py validate
          test -f addons/gdble/libgdble.windows.x86_64.dll
          test -f addons/gdble/libgdble.linux.x86_64.so
          test -f addons/gdble/libgdble.macos.x86_64.dylib
          test -f addons/gdble/libgdble.macos.arm64.dylib
          test -f addons/gdble/android/gdble-release.aar
          test -f addons/gdble/android/btleplug-release.aar
          (cd addons/gdble && sha256sum --check SHA256SUMS)
          ! find addons/gdble -maxdepth 1 -type f \( -name 'gdble.dll' -o -name 'libgdble.android.*.so' -o -name 'libgdble.arm64.so' -o -name 'libgdble.x86_64.so' \) | grep .
          ! git ls-tree -r --name-only HEAD demo/addons/gdble | grep .
      - name: Package tag contents
        run: |
          mkdir -p package
          cp -R addons package/
          cp README.md README_EN.md LICENSE package/
          (cd package && zip -r ../gdble-${GITHUB_REF_NAME}.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          files: gdble-${{ github.ref_name }}.zip
